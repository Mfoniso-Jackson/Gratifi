name: Hourly blockchain batch

# Writes the hourly batch of tips to Base (and the Bitcoin backup) by calling the app's scheduled
# job. Vercel's free plan only runs scheduled jobs once a day, so this runs it every hour instead.
# Set these repository secrets to switch it on (it does nothing until both are set):
#   GRATIFI_APP_URL  e.g. https://gratifi.example
#   CRON_SECRET      the same value as the app's CRON_SECRET

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the hourly batch
        env:
          APP_URL: ${{ secrets.GRATIFI_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "GRATIFI_APP_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/retry-anchoring"
